name: Verify documentation rollout

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed

permissions:
  contents: read

jobs:
  verify:
    name: Verify bundled documentation rollout
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    concurrency:
      group: verify-documentation-production
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Check out the CI-verified main revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Select supported Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Verify the public documentation matches the CI-verified source
        env:
          VERIFIED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from "node:fs/promises";
          import { setTimeout as delay } from "node:timers/promises";

          const expected = await readFile("docs/getting-started.md", "utf8");
          const origin = "https://docs.clank.run";
          const deadline = Date.now() + 270_000;
          let lastFailure = "Documentation rollout has not been observed.";
          let verified = false;
          async function readPublic(path) {
            const response = await fetch(new URL(path, origin), {
              redirect: "error",
              cache: "no-store",
              headers: { "cache-control": "no-cache" },
              signal: AbortSignal.timeout(Math.max(1, Math.min(10_000, deadline - Date.now()))),
            });
            if (!response.ok) {
              await response.body?.cancel();
              throw new Error(`Documentation responded with HTTP ${response.status}.`);
            }
            return response.text();
          }
          while (Date.now() < deadline) {
            try {
              const [markdown, home] = await Promise.all([
                readPublic("/raw/getting-started.md"),
                readPublic("/"),
              ]);
              if (markdown !== expected) throw new Error("Published Getting Started differs from the CI-verified source.");
              if (!home.includes(">Copy setup prompt</button>")) throw new Error("The documentation home is missing its setup prompt button.");
              verified = true;
              console.log(`Published Getting Started and home verified against CI revision ${process.env.VERIFIED_SHA}.`);
              break;
            } catch (error) {
              lastFailure = error instanceof Error ? error.message : "Documentation request failed.";
              console.log(`Waiting for the bundled documentation rollout: ${lastFailure}`);
            }
            await delay(Math.max(0, Math.min(5_000, deadline - Date.now())));
          }
          if (!verified) throw new Error(`Documentation rollout was not verified within 270 seconds: ${lastFailure}`);
          NODE

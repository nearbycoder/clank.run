name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  type-contracts:
    name: Semantic and packed consumer types
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Provision pinned external type tools
        run: npm install --prefix "$RUNNER_TEMP/clank-type-tools" --ignore-scripts --no-package-lock --no-audit --no-fund typescript@5.9.3 @types/node@26.6.4
      - name: Verify semantic baseline and packed consumers
        run: |
          npm run build
          node scripts/type-contracts.mjs --typescript "$RUNNER_TEMP/clank-type-tools/node_modules/typescript/lib/typescript.js" --type-roots "$RUNNER_TEMP/clank-type-tools/node_modules/@types"

  runtime:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node:
          - "22.16"
          - "24"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false

      - name: Verify lock-free dependency contract
        run: |
          test ! -f package-lock.json
          test ! -f npm-shrinkwrap.json
          node -e 'const p=require("./package.json"); for (const k of ["dependencies","devDependencies","peerDependencies","optionalDependencies"]) if (p[k] && Object.keys(p[k]).length) process.exit(1)'

      - name: Install Linux isolation prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends bubblewrap util-linux nftables iproute2 procps apparmor
          sudo apparmor_parser --replace scripts/ci-linux.apparmor

      - name: Build and run unit/integration tests
        run: npm test

      - name: Verify published file set
        run: npm pack --dry-run

  conformance:
    name: Packaged-release conformance
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select minimum Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.16"
          package-manager-cache: false

      - name: Run complete release gate
        # Kernel isolation is exercised locally by the suite, including real
        # user/network namespaces; unavailable enforcement must fail the gate.
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends bubblewrap util-linux nftables iproute2 procps apparmor
          sudo apparmor_parser --replace scripts/ci-linux.apparmor
          npm run check

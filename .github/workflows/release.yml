name: Publish release

on:
  release:
    types:
      - published

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

concurrency:
  group: publish-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish:
    name: Verify, attest, and publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: npm
    steps:
      - name: Check out the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false

      - name: Select trusted-publishing Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Select trusted-publishing npm
        run: npm install --global npm@11.18.0

      - name: Match package identity and version to release tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          test "$(npm --version)" = "11.18.0"
          test "$(node -p 'require("./package.json").name')" = "@clank.run/framework"
          PACKAGE_VERSION="$(node -p 'require("./package.json").version')"
          test "$RELEASE_TAG" = "v$PACKAGE_VERSION"

      - name: Run complete release gate
        run: npm run check

      - name: Produce release tarball
        id: pack
        run: |
          TARBALL="$(npm pack --json | node -e 'let value="";process.stdin.on("data",c=>value+=c).on("end",()=>process.stdout.write(JSON.parse(value)[0].filename))')"
          echo "tarball=$TARBALL" >> "$GITHUB_OUTPUT"

      - name: Attest the tarball
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4
        with:
          subject-path: ${{ steps.pack.outputs.tarball }}

      - name: Attach tarball to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          TARBALL: ${{ steps.pack.outputs.tarball }}
        run: gh release upload "$RELEASE_TAG" "$TARBALL" --clobber

      - name: Stage on npm through trusted publishing
        run: npm stage publish --access public
